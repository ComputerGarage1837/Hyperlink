name: Family controller checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, openssl, mbstring, curl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        working-directory: server
      - run: composer audit --no-interaction
        working-directory: server
      - run: php tests/controller.php
        working-directory: server
      - run: php tests/api.php
        working-directory: server
