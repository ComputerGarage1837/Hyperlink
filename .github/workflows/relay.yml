name: Private relay
on: [push, pull_request, workflow_dispatch]
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r relay/requirements.txt
      - run: python relay/test_relay.py
