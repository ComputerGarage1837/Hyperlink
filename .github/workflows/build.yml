name: Windows draft
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run security checks
        shell: powershell
        run: ./build.ps1 -Test
      - name: Upload portable draft
        uses: actions/upload-artifact@v4
        with:
          name: Hyperlink-Windows-0.1.0
          path: |
            build/Hyperlink.exe
            build/README.md
            build/self-test.txt
            build/docs/ROADMAP.md
