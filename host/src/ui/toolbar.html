<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --gold: #e3b341; --text: #f5ecd6; --muted: #a99f88; --line: #3a3122; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--text); }
  .bar { position: absolute; inset: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px;
    background: rgba(18,16,12,.96); border-bottom: 1px solid var(--line); }
  .title { font-weight: 600; margin-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .stats { color: var(--muted); font: 12px "Cascadia Mono", Consolas, monospace; margin-left: auto; white-space: nowrap; }
  button { font: inherit; color: var(--text); background: #1d1a14; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 11px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #8c6822; color: var(--gold); }
  button.on { background: rgba(227,179,65,.16); border-color: #8c6822; color: var(--gold); }
  button.x:hover { background: #3a1616; border-color: #7a2a2a; color: #ffb4b4; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .menu { position: fixed; top: 44px; background: #1c1914; border: 1px solid var(--line); border-radius: 10px; padding: 5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.6); min-width: 220px; }
  .menu div { padding: 7px 12px; border-radius: 7px; cursor: pointer; display: flex; gap: 8px; }
  .menu div:hover { background: rgba(227,179,65,.14); color: var(--gold); }
  .menu .ck { width: 14px; color: var(--gold); }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<script>
const send = o => window.chrome.webview.postMessage(JSON.stringify(o));
let s = { screens: [], focused: -1 };
function b(label, cmd, cls) { const e = document.createElement('button'); e.textContent = label; if (cls) e.className = cls;
  e.onclick = ev => { ev.stopPropagation(); typeof cmd === 'function' ? cmd(ev) : send({ cmd }); }; return e; }
function menu(ev, items) {
  document.querySelectorAll('.menu').forEach(m => m.remove());
  const m = document.createElement('div'); m.className = 'menu';
  items.forEach(([label, cmd, checked]) => { const d = document.createElement('div');
    d.innerHTML = `<span class="ck">${checked ? '✓' : ''}</span>`; d.append(label);
    d.onclick = () => { m.remove(); send({ cmd }); send({ cmd: 'menuClosed' }); }; m.append(d); });
  document.body.append(m);
  m.style.left = Math.min(ev.target.getBoundingClientRect().left, innerWidth - 240) + 'px';
  send({ cmd: 'menuOpen', height: m.offsetHeight + 60 });
  setTimeout(() => document.addEventListener('click', () => { m.remove(); send({ cmd: 'menuClosed' }); }, { once: true }));
}
function render() {
  const bar = document.getElementById('bar'); bar.replaceChildren();
  const t = document.createElement('div'); t.className = 'title'; t.textContent = s.title || ''; bar.append(t);
  if (s.screens.length > 1) {
    bar.append(b('All screens', 100, s.focused < 0 ? 'on' : ''));
    s.screens.forEach((sc, i) => bar.append(b(`${i + 1}  ${sc.name}`, 101 + i, s.focused == i ? 'on' : '')));
    bar.append(b('Show…', ev => menu(ev, s.screens.map((sc, i) => [`${i + 1}  ${sc.name}`, 200 + i, !sc.hidden]))));
    bar.append(b('New window…', ev => menu(ev, s.screens.map((sc, i) => [`${i + 1}  ${sc.name}`, 300 + i, sc.popped]))));
  }
  bar.append(Object.assign(document.createElement('div'), { className: 'sep' }));
  bar.append(b('Keys…', ev => menu(ev, [['Task Manager (Ctrl+Shift+Esc)', 402], ['Start menu (Win)', 403], ['Switch app (Alt+Tab)', 404], ['Change PIN for this device', 406]])));
  bar.append(b('Full screen', 400, s.fullscreen ? 'on' : ''));
  const st = document.createElement('div'); st.className = 'stats'; st.textContent = s.stats || ''; bar.append(st);
  bar.append(b('Disconnect', 405, 'x'));
}
window.chrome.webview.addEventListener('message', e => { const m = JSON.parse(e.data); if (m.type === 'state') { s = m; render(); } });
document.body.addEventListener('mouseleave', () => send({ cmd: 'leave' }));
render();
send({ cmd: 'ready' });
</script>
</body>
</html>
